function parseDate(t){
 const n=midnight(new Date());let m;
 if(/après-demain|apres-demain/.test(t)){n.setDate(n.getDate()+2);return[F(n),/après-demain|apres-demain/]}
 if(/demain/.test(t)){n.setDate(n.getDate()+1);return[F(n),/demain/]}
 if((m=t.match(new RegExp("(\\d{1,2})(?:er)?\\s+("+MOIS.join("|")+")")))){
  let d=new Date(n.getFullYear(),MOIS.indexOf(m[2]),+m[1]);if(d<n)d.setFullYear(d.getFullYear()+1);return[F(d),m[0]]}
 if((m=t.match(/(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/))){
  let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):n.getFullYear(),d=new Date(y,+m[2]-1,+m[1]);if(!m[3]&&d<n)d.setFullYear(y+1);return[F(d),m[0]]}
 if((m=t.match(new RegExp("("+JOURS.join("|")+")(?: prochain)?")))&&/le |ce |pour |au |à |a /.test(t)){
  let d=new Date(n),k=JOURS.indexOf(m[1]);do d.setDate(d.getDate()+1);while(dowOf(d)!=k);return[F(d),m[0]]}
 return[null,null];
}
function run(raw){
 let t=raw.toLowerCase().trim();if(!t)return;
 if(/semaine (suivante|prochaine)/.test(t)){off++;render();return msg("→ Semaine suivante")}
 if(/semaine (précédente|precedente|dernière)/.test(t)){off--;render();return msg("→ Semaine précédente")}
 if(/cette semaine|aujourd/.test(t)&&!/ds|devoir/.test(t)){off=0;render();return msg("→ Cette semaine")}
 const found=S.ds.find(x=>t.includes(x.subj.toLowerCase()));
 if(/supprime|efface|retire|annule/.test(t)){
  if(!found)return msg("Je n'ai pas trouvé quel DS supprimer.");
  S.ds=S.ds.filter(x=>x!==found);save();render();return msg(`🗑️ ${found.kind} ${found.subj} supprimé`)}
 let [date,dtxt]=parseDate(t);if(dtxt)t=t.replace(dtxt," ");
 let h=null,hm=t.match(/(\d+(?:[.,]\d+)?)\s*(?:h|heures?)\s*(\d{2})?/);
 if(hm){h=+hm[1].replace(",",".")+(hm[2]?hm[2]/60:0);t=t.replace(hm[0]," ")}
 let topic="",tm=t.match(/(?:sur|chapitres?|révisions?|revisions?|réviser|programme)\s+(?:les |le |la |l'|des |du )?(.+)$/);
 if(tm)topic=tm[1].trim();
 if(found&&/décale|decale|déplace|change|mets|passe|modifie|augmente|rajoute|pour/.test(t)&&!/\b(ds|devoir|dm)\b/.test(t.replace(found.subj.toLowerCase(),""))){
  if(date)found.date=date;if(h!=null)found.h=h;if(topic)found.topic=topic;
  save();render();return msg(`✏️ ${found.kind} ${found.subj} mis à jour`)}
 const km=t.match(/\b(ds|devoir|dm|contrôle|controle)\b\s+(?:de |d'|du |en |d’)?([a-zéèêàçùû\-]+)/);
 if(!km||!date||h==null)return msg(`Il me manque : ${[!km&&"matière",!date&&"date",h==null&&"heures"].filter(Boolean).join(", ")}. Dis par ex. « DS de maths le 15 octobre 6 heures sur les intégrales ».`);
 S.ds.push({id:Date.now(),kind:/devoir|dm/.test(km[1])?"Devoir":"DS",subj:km[2][0].toUpperCase()+km[2].slice(1),date,h,topic});
 save();render();msg(`✅ ${km[1].toUpperCase()} ${km[2]} ajouté, révisions replanifiées.`);
}

 const m=$("md"),d=pdate(key.split("|")[0]),w=Math.floor(Math.round((midnight(d)-pdate(S.run.start))/864e5)/7)+1;

const num=v=>{const x=parseFloat(String(v==null?"":v).replace(",","."));return isNaN(x)?null:x};
const f1=x=>x==null?"–":(Math.round(x*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2});
let nt=(()=>{const n=new Date();return n<new Date(2026,10,30)?1:n<new Date(2027,2,1)?2:3})();
if(!S.goals)S.goals={gen:{1:16,2:17,3:17},subj:{"Maths":{1:14},"Physique-Chimie":{1:15},"Français":{1:17},"Anglais":{1:14},"Espagnol":{1:15},"Histoire-Géo":{1:15},"SVT":{1:16},"Enseignement scientifique":{1:17}}};
const gGoal=()=>num((S.goals.gen||{})[nt]),sGoal=sub=>num((((S.goals.subj||{})[sub])||{})[nt]);
const gl=sub=>(S.grades[sub]||[]).filter(g=>(g.t||1)==nt);
const n20=g=>g.n!=null&&g.b>0?g.n/g.b*20:null,p20=g=>g.p!=null&&g.b>0?g.p/g.b*20:null;
function subjStats(sub){let A=0,wA=0,P=0,Aa=0,wa=0,up=0;
 gl(sub).forEach(g=>{const a=n20(g),q=p20(g),c=+g.c||1;if(a!=null){A+=a*c;wA+=c;if(q!=null){P+=q*c;Aa+=a*c;wa+=c}}else if(q!=null)up++});
 return{A:wA?A/wA:null,P:wa?P/wa:null,Aa:wa?Aa/wa:null,up}}
function genStats(){let A=0,wA=0,P=0,Aa=0,wa=0,up=0;
 S.subjects.forEach(sub=>{const st=subjStats(sub),c=num(S.coef[sub]);const k=c==null?1:c;up+=st.up;
  if(st.A!=null){A+=st.A*k;wA+=k}if(st.P!=null){P+=st.P*k;Aa+=st.Aa*k;wa+=k}});
 return{A:wA?A/wA:null,P:wa?P/wa:null,Aa:wa?Aa/wa:null,up}}
const dcls=d=>Math.abs(d)<.005?"eq":d>0?"up":"dn",dtxt=d=>Math.abs(d)<.005?"= prévu":(d>0?"▲ +":"▼ −")+f1(Math.abs(d));
function cmpHtml(st){
 if(st.P==null)return st.up?`<span>${st.up} note${st.up>1?"s":""} à venir</span>`:`<span>Ajoute un « prévu » pour comparer</span>`;
 const d=st.Aa-st.P;return`Sur tes prévisions : prévu <b>${f1(st.P)}</b> → réel <b>${f1(st.Aa)}</b> <b class="${dcls(d)}">${dtxt(d)}</b>`}
function goalHtml(avg,goal){
 if(goal==null)return"";
 if(avg==null)return`<span>Objectif ${f1(goal)} · pas encore de note</span>`;
 const d=avg-goal;return d>=-.005?`<b class="up">✔ objectif atteint</b><span>${f1(avg)} / ${f1(goal)} (${d>.005?"+"+f1(d):"pile"})</span>`:`<b class="dn">encore ${f1(-d)} pt</b><span>pour atteindre ${f1(goal)} (actuel ${f1(avg)})</span>`}
function gbar(el,avg,goal){if(!el)return;const ok=goal!=null&&avg!=null;el.className="gbar"+(ok?(avg>=goal-.005?" up":" dn"):"");el.firstChild.style.width=(ok?Math.max(0,Math.min(100,avg/goal*100)):0)+"%"}
function rowInfo(g){const a=n20(g),q=p20(g);
 if(a!=null&&q!=null){const d=a-q;return{c:dcls(d),t:dtxt(d).replace("= prévu","=")}}
 return{c:"",t:q!=null?"à venir":"—"}}
function paint(){

 const G=genStats();$("gen").textContent=f1(G.A);$("gcmp").innerHTML=cmpHtml(G);$("ggoal").innerHTML=goalHtml(G.A,gGoal());gbar($("ggb"),G.A,gGoal());
}

function quickAdd(){
 const raw=($("qt").value||"").trim();
 if(!pick)return msg("Choisis d'abord une matière (ou le tennis) dans le panneau, puis écris.");
 if(!raw)return msg("Écris ce que tu veux ajouter (ex : exercices 12 à 15, à 17h).");
 let t=" "+raw.toLowerCase()+" ",date=F(selD),du=dur,st=null;
 const [pd2,dm]=parseDate(t);if(pd2){date=pd2;t=t.replace(dm," ")}
 let m=t.match(/(?:à|a|vers|dès)\s*(\d{1,2})\s*h\s*(\d{2})?/);if(m){st=+m[1]+(m[2]?+m[2]/60:0);t=t.replace(m[0]," ")}
 m=t.match(/(\d+)\s*min/);if(m)du=+m[1]/60;
 else{m=t.match(/(\d+(?:[.,]\d+)?)\s*h(?:eures?)?\s*(\d{2})?/);if(m){const v=+m[1].replace(",",".")+(m[2]?m[2]/60:0);if(v<=6)du=v;else if(st==null)st=v}}
 const d=pdate(date),isT=date==F(new Date()),nw=new Date(),nowH=isT?nw.getHours()+nw.getMinutes()/60+.25:0;
 const ev=evFor(d,plan().out).filter(e=>!e.all);
 const kk=pick=="@ten"?"ten":pick=="@match"?"match":ptype,ttl=kk=="ten"||kk=="match"?SP[pick]:pick;
 let s0=st,where="",eFix=null;if(kk=="ctrl"){const c=courseAt(date,st,ttl);if(c){s0=c.s;eFix=c.e;where=" sur ton cours"}}
 if(s0==null){
  const ph=kk=="devoir"?ev.filter(e=>e.nm=="À définir"&&e.e-Math.max(e.s,nowH)>=.5).sort((a,b)=>a.s-b.s)[0]:null;
  if(ph){s0=Math.ceil(Math.max(ph.s,nowH)*4)/4;du=Math.min(du,ph.e-s0);where=" dans ton créneau de devoirs"}
  else{const busy=ev.filter(e=>e.nm!="À définir").map(e=>[e.s,e.e]).sort((a,b)=>a[0]-b[0]);let c=Math.max(8,Math.ceil(nowH*4)/4);
   for(const [a,b] of busy){if(c+du<=a)break;if(b>c)c=Math.ceil(b*4)/4}
   s0=c+du<=22.75?c:null}
 }
 if(s0==null||s0>=23)return msg("Pas de créneau libre ce jour-là : donne une heure (ex : à 17h) ou change de jour.");
